[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-eda"
version = "0.3.0"
description = "A tiny, modern matplotlib + pandas charting library for exploratory data analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "erinnalani" }]
keywords = ["matplotlib", "pandas", "visualization", "charts", "eda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.5",
    "pandas>=1.3",
]

[project.urls]
Homepage = "https://github.com/erinnalani/comms_vis"

[tool.setuptools.packages.find]
where = ["src"]
